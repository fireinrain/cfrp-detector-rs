[workspace]
resolver = "2"
members = [
  "crates/cfrp-detector",
  "crates/cfrp-detector-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/fireinrain/cfrp-detector"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
http = "1.5.0"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true