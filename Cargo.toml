[workspace]
resolver = "2"
members = ["crates/cfrp-detector", "crates/cfrp-detector-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/fireinrain/cfrp-detector"
homepage = "https://github.com/fireinrain/cfrp-detector"
authors = ["fireinrain <fireinrain@users.noreply.github.com>"]

[workspace.dependencies]
cfrp-detector = { path = "crates/cfrp-detector", version = "0.1.0" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
csv = "1.3.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.34"
http = "1.5.0"
toml = "1.1.4"
indicatif = "0.18.6"
libc = "0.2.177"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "http2",
  "charset",
  "json",
  "stream",
] }
rustls = { version = "0.23.43" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "time",
  "sync",
  "fs",
  "io-util",
  "signal",
] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.19" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true