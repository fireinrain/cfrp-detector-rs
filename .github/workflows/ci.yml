name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_TOOLCHAIN: 1.97.1
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (debug, -D warnings)
        run: cargo clippy --all --all-targets

  test:
    name: Tests (Linux x86_64)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install masscan
        run: |
          sudo apt-get update
          sudo apt-get install -y masscan
          # 1) masscan 1.3.2 上游 bug: --version 正常打印但 exit code=1, 加 || true 绕过
          #    (见 https://github.com/robertdavidgraham/masscan 多个 issue 报告)
          masscan --version || true
          # 2) 验证二进制真实存在且可执行 (比 --version 更可靠的健康检查)
          which masscan && test -x "$(which masscan)"
          # 3) 给 masscan 授予 CAP_NET_RAW (允许非 root 发送原始 SYN 包),
          #    否则 cargo test 以 runner 用户跑会 permission denied.
          #    若 setcap 不可用则 fallback: chmod u+s (风险可接受, CI 临时容器)
          if command -v setcap >/dev/null 2>&1; then
            sudo setcap cap_net_raw+ep "$(which masscan)"
            echo "setcap cap_net_raw+ep OK"
          else
            sudo chmod u+s "$(which masscan)"
            echo "setcap unavailable, fallback to chmod u+s"
          fi

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo test --all
        run: cargo test --all --no-fail-fast -- --nocapture
        env:
          CFRP_CI: 1

      - name: Coverage report
        run: cargo llvm-cov --all --lcov --output-path lcov.info
        continue-on-error: true

      - name: Upload to codecov
        uses: codecov/codecov-action@v5
        if: success() || failure()
        with:
          files: lcov.info
          fail_ci_if_error: false

  clippy-release:
    name: Clippy Release (pedantic allowlist)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: release

      - name: cargo clippy --release
        run: |
          cargo clippy --all --release --all-targets -- \
            -A clippy::module_name_repetitions \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_precision_loss \
            -A clippy::cast_sign_loss \
            -A clippy::missing_panics_doc \
            -A clippy::missing_errors_doc \
            -D warnings

  cross-compile:
    name: Cross-compile ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: cross-${{ matrix.target }}

      - name: Install cross (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cross

      - name: Build (Linux via cross)
        if: matrix.os == 'ubuntu-latest'
        run: cross build --release --target ${{ matrix.target }} -p cfrp-detector-cli

      - name: Build (native macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --target ${{ matrix.target }} -p cfrp-detector-cli

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfrp-detector-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cfrp-detector
            target/${{ matrix.target }}/release/cfrp-detector.exe
          if-no-files-found: ignore

  bench-smoke:
    name: Bench smoke (1 iteration)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: bench

      - name: Bench smoke
        run: cargo bench --bench performance -- --sample-size 10 --quick --noplot
        timeout-minutes: 10